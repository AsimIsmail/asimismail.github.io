
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} |
    {% endif %}
    {{ site.title }}
  </title>

  <meta name="description" content="{{ site.description }}">

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <header class="site-header">
    <div class="wrapper">

      <a class="site-title"
         href="{{ '/' | relative_url }}">
        AsimSec_
      </a>

      <nav class="site-nav">
        <a class="page-link" href="{{ '/' | relative_url }}">Home</a>
        <a class="page-link" href="{{ '/about/' | relative_url }}">About</a>
        <a class="page-link" href="{{ '/writeups/' | relative_url }}">Write-ups</a>
        <a class="page-link" href="{{ '/projects/' | relative_url }}">Projects</a>
      </nav>

    </div>
  </header>

  <main class="page-content wrapper">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>
        AsimSec_ | Cybersecurity Blog & Portfolio
      </p>
      <p>
        Exploring. Learning. Securing.
      </p>
    </div>
  </footer>

</body>
</html>
